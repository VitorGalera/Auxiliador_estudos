<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciclo de Foco</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1>Ciclo de Foco</h1>

  <section class="card">
    <p class="phase-label" id="phaseLabel">Hora de estudar</p>
    <div class="time" id="timeDisplay">25:00</div>
    <p class="cycle-count" id="cycleCount">Ciclos concluídos: 0</p>

    <div class="controls">
      <button class="btn-primary" id="startPauseBtn">Iniciar</button>
      <button id="resetBtn">Reiniciar</button>
    </div>

    <div class="settings">
      <div class="field">
        <label for="studyInput">Estudo (min)</label>
        <input type="number" id="studyInput" min="1" max="180" value="25">
      </div>
      <div class="field">
        <label for="restInput">Descanso (min)</label>
        <input type="number" id="restInput" min="1" max="60" value="5">
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Tarefas</h2>

    <form class="task-form" id="taskForm">
      <input type="text" id="taskInput" placeholder="O que você precisa estudar?" autocomplete="off">
      <button type="submit" class="btn-primary">Adicionar</button>
    </form>

    <ul class="task-list" id="taskList"></ul>
    <p class="empty-state" id="emptyState">Nenhuma tarefa ainda. Adicione a primeira acima.</p>

    <div class="tasks-footer">
      <span id="taskSummary">0 de 0 concluídas</span>
      <button id="clearDoneBtn" type="button">Remover concluídas</button>
    </div>
  </section>
</div>

<script src="script.js"></script>
</body>
</html>
